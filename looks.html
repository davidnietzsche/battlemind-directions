ion: glossy black, red and white toy icons with the little characters.", "50% 50%", "70% 50%", "68% 30%", 0], ["a_capsules", "A", "Capsules", "Plain red and white capsules, like a real machine. The services stay a surprise until a capsule opens.", "50% 50%", "70% 50%", "68% 30%", 0], ["b_white", "B", "White ceramic", "The same marketing icons in one matte white material. Calm and clean, no black, no characters.", "50% 50%", "70% 50%", "68% 30%", 0], ["c_red", "C", "Red on red", "Real objects all sprayed brand red, like an art-directed still life.", "50% 50%", "70% 50%", "68% 30%", 0], ["d_glass", "D", "Glass", "Icon shapes in clear and red glass. The most premium reading.", "50% 50%", "70% 50%", "68% 30%", 0], ["e_tiles", "E", "Icon tiles", "Flat white tiles with simple red pictograms, like app icons. Graphic, not toy-like.", "50% 50%", "70% 50%", "68% 30%", 0], ["f_metal", "F", "Brushed metal", "Icons machined from aluminium and steel with a few in red.", "50% 50%", "70% 50%", "68% 30%", 0], ["g_real", "G", "Real kit", "The real tools of the job: camera, megaphone, clapperboard, ring light, laptop.", "50% 50%", "70% 50%", "68% 30%", 0]];
