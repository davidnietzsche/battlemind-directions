<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object styles for the hero · Battle Mind</title><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#D7000F;--ink:#0D131A;--h:Oswald,sans-serif;--b:Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--red);color:#fff;font:16px/1.5 var(--b);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}.stage img.on{opacity:1}
.shade{position:fixed;left:0;right:0;top:0;height:200px;background:linear-gradient(180deg,rgba(64,0,5,.6),rgba(64,0,5,0));pointer-events:none}
.top{position:fixed;left:0;right:0;top:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,64px);z-index:3}.top img{height:22px}.top a{color:#fff;text-decoration:none;font-weight:500;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.copy{position:fixed;z-index:2;left:clamp(18px,4vw,64px);top:46%;translate:0 -50%;max-width:38vw}
.copy h1{margin:0;font:600 min(7.2vw,13vh)/.88 var(--h);text-transform:uppercase;letter-spacing:.02em}.copy p{margin:18px 0 0;max-width:36ch;opacity:.92}
.cta{display:inline-flex;align-items:center;gap:16px;height:58px;padding:0 7px 0 26px;border-radius:999px;background:#fff;color:var(--ink);font-weight:500;margin-top:22px}.cta i{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center}.cta svg{width:16px;height:16px;color:#fff}
.bar{position:fixed;z-index:4;left:0;right:0;bottom:0;padding:14px clamp(12px,3vw,40px) 16px;background:linear-gradient(0deg,rgba(13,19,26,.86),rgba(13,19,26,.62));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.now{display:flex;gap:14px;align-items:baseline;margin:0 4px 10px;flex-wrap:wrap}.now b{font:600 20px var(--h);text-transform:uppercase;letter-spacing:.04em}.now span{opacity:.82;font-size:14.5px}.now em{font-style:normal;margin-left:auto;font-size:12.5px;opacity:.6}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}.row button{all:unset;flex:none;width:clamp(104px,10.5vw,168px);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;background:#000;position:relative}
.row button img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:68% 30%;opacity:.72;transition:opacity .2s}.row button:hover img{opacity:1}.row button.on img{opacity:1}.row button.on{outline:3px solid #fff;outline-offset:-3px}
.row button span{position:absolute;left:8px;top:6px;font:600 13px var(--h);letter-spacing:.08em;background:rgba(13,19,26,.8);padding:2px 8px;border-radius:999px}.row button:focus-visible{outline:3px solid #fff}
@media (max-width:760px){.copy{max-width:none;right:18px;top:22%;translate:none}.copy h1{font-size:13vw}.copy p{display:none}.stage img{object-position:70% 50%}.now em{display:none}}
@media (prefers-reduced-motion:reduce){.stage img{transition:none}}
</style></head><body>
<div class="stage" id="stage"></div><div class="shade"></div>
<div class="top"><img src="assets3/battle-white.webp" alt="Battle"><a href="index.html#looks">Back to the review page</a></div>
<div class="copy"><h1>Human<br>First.<br>Results<br>Always.</h1><p>Trusted by 160+ clients across 14+ industries.</p><span class="cta">Let's talk<i><svg viewBox="0 0 16 16"><path d="M4 12 12 4M5.5 4H12v6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i></span></div>
<div class="bar"><div class="now"><b id="nm"></b><span id="ds"></span><em>Arrow keys switch</em></div><div class="row" id="row" role="tablist" aria-label="Object styles"></div></div>
<script>
const V = [['0_toys', 'Now', 'Toy icons', 'The current version: glossy black, red and white toy icons with the little characters.'],
 ['a_capsules', 'A', 'Capsules', 'Plain red and white capsules, like a real machine. The services stay a surprise until a capsule opens.'],
 ['b_white', 'B', 'White ceramic', 'The same marketing icons in one matte white material. Calm and clean, no black, no characters.'],
 ['c_red', 'C', 'Red on red', 'Real objects all sprayed brand red, like an art-directed still life.'],
 ['d_glass', 'D', 'Glass', 'Icon shapes in clear and red glass. The most premium reading.'],
 ['e_tiles', 'E', 'Icon tiles', 'Flat white tiles with simple red pictograms, like app icons. Graphic, not toy-like.'],
 ['f_metal', 'F', 'Brushed metal', 'Icons machined from aluminium and steel with a few in red.'],
 ['g_real', 'G', 'Real kit', 'The real tools of the job: camera, megaphone, clapperboard, ring light, laptop.']];
const stage = document.getElementById('stage'), row = document.getElementById('row'); let cur = 0;
V.forEach((v, i) => { const im = new Image(); im.src = `gen/look-${v[0]}.webp`; im.alt = v[2]; stage.append(im); const b = document.createElement('button'); b.setAttribute('role', 'tab'); b.innerHTML = `<img src="gen/look-${v[0]}.webp" alt=""><span>${v[1]}</span>`; b.title = v[2]; b.onclick = () => show(i); row.append(b); });
function show(i) { cur = (i + V.length) % V.length; [...stage.children].forEach((im, k) => im.classList.toggle('on', k === cur)); [...row.children].forEach((b, k) => { b.classList.toggle('on', k === cur); b.setAttribute('aria-selected', k === cur); }); document.getElementById('nm').textContent = `${V[cur][1]} · ${V[cur][2]}`; document.getElementById('ds').textContent = V[cur][3]; history.replaceState(null, '', '?v=' + V[cur][1].toLowerCase()); row.children[cur].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); });
const q = new URLSearchParams(location.search).get('v'); const start = V.findIndex((v) => v[1].toLowerCase() === String(q || '').toLowerCase()); show(start < 0 ? 2 : start);
</script></body></html>
