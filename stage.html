<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle Mind · 04 Stage · six colour combinations</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#D7000F;--ink:#0A0A0B;--f:"Archivo",system-ui,sans-serif;--o:"Oswald",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
.top{padding:56px 40px 28px;max-width:1400px;margin:0 auto}
.lbl{font:600 12px var(--o);letter-spacing:.22em;text-transform:uppercase;color:var(--red)}.lbl a{color:inherit;text-decoration:none}.lbl a:hover{text-decoration:underline}
h1{font-weight:800;letter-spacing:-.03em;font-size:clamp(34px,4.5vw,60px);line-height:1;margin:10px 0 14px}
.note{color:#555;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:34px 28px;padding:0 40px 80px;max-width:1400px;margin:0 auto}
@media (max-width:640px){.grid{grid-template-columns:1fr;padding:0 16px 60px}.top{padding:36px 16px 20px}}
.card{border:1px solid #e6e6e6;border-radius:18px;overflow:hidden;background:#fff}
.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#f3f3f3;cursor:zoom-in}
.card .b{padding:16px 18px 18px}
.card h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}.card h2 small{font:600 12px var(--o);letter-spacing:.18em;color:var(--red)}
.sw{display:inline-flex;gap:4px;margin-left:auto}.sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.card p{margin:8px 0 0;color:#444}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:9;cursor:zoom-out}.zoom.on{display:grid}.zoom img{max-width:96vw;max-height:94vh;border-radius:10px}
</style></head><body>
<div class="top"><div class="lbl"><a href="./">← all 20 directions</a> · 04 Stage</div>
<h1>Same stage, six colour combinations.</h1>
<p class="note">One composition, one person, one headline. Only the roles of the three colours change: which one is the stage, which one is the type, which one is the accent (underline, megaphone, spotlight). Tap to zoom.</p></div>
<div class="grid" id="g"></div>
<div class="zoom" id="z"><img alt=""></div>
<script>
const K = { b: ['#0D131A', 'black'], w: ['#ffffff', 'white'], r: ['#D7000F', 'red'] };
const C = [
 ['04-black-stage', 'b', 'w', 'r', 'The original. Black stage, white type, red accent. Cinematic; the red megaphone is the only colour.'],
 ['stage-b-r-w', 'b', 'r', 'w', 'Black stage, red type, white accent. The headline carries the red; the underline, megaphone and spotlight go white.'],
 ['stage-w-b-r', 'w', 'b', 'r', 'White stage, black type, red accent. The brightest and most "day" version; red reads hottest on white.'],
 ['stage-w-r-b', 'w', 'r', 'b', 'White stage, red type, black accent. Editorial and graphic; the black spotlight pool becomes a disc she stands on.'],
 ['stage-r-w-b', 'r', 'w', 'b', 'Red stage, white type, black accent. Maximum brand red; bold, loud, confident.'],
 ['stage-r-b-w', 'r', 'b', 'w', 'Red stage, black type, white accent. Red with a heavier, more serious voice; the white spotlight lifts her out.'],
];
const g = document.getElementById('g'), z = document.getElementById('z');
C.forEach(([f, s, t, a, d], i) => { const el = document.createElement('article'); el.className = 'card';
  el.innerHTML = `<img src="gen/${f}.webp" alt="" loading="lazy"><div class="b"><h2><small>0${i + 1}</small>${K[s][1]} stage · ${K[t][1]} type · ${K[a][1]} accent<span class="sw" title="stage / type / accent"><i style="background:${K[s][0]}"></i><i style="background:${K[t][0]}"></i><i style="background:${K[a][0]}"></i></span></h2><p>${d}</p></div>`;
  el.querySelector('img').onclick = e => { z.querySelector('img').src = e.target.src; z.classList.add('on'); }; g.appendChild(el); });
z.onclick = () => z.classList.remove('on');
</script></body></html>
